<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>404</title>
    <meta http-equiv="refresh" content="0; url=/Portfolio/" />
    <script>
      // SPA fallback for GitHub Pages
      (function() {
        var segment = '/Portfolio';
        var path = window.location.pathname;
        if (path && !path.startsWith(segment)) {
          segment = '';
        }
        var target = segment + '/';
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirigiendo…</p>
  </body>
</html>
